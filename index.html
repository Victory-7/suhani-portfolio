// ── Typing Animation ────────────────────────────────────────────
const TypingText = ({ texts, dark }) => {
  const [displayed, setDisplayed] = useState('');
  const [textIdx, setTextIdx] = useState(0);
  const [charIdx, setCharIdx] = useState(0);
  const [deleting, setDeleting] = useState(false);
  useEffect(() => {
    const current = texts[textIdx];
    let delay = deleting ? 40 : 80;
    if (!deleting && charIdx === current.length) delay = 2000;
    if (deleting && charIdx === 0) delay = 400;
    const t = setTimeout(() => {
      if (!deleting && charIdx < current.length) {
        setDisplayed(current.slice(0, charIdx + 1));
        setCharIdx(c => c + 1);
      } else if (!deleting && charIdx === current.length) {
        setDeleting(true);
      } else if (deleting && charIdx > 0) {
        setDisplayed(current.slice(0, charIdx - 1));
        setCharIdx(c => c - 1);
      } else {
        setDeleting(false);
        setTextIdx(i => (i + 1) % texts.length);
      }
    }, delay);
    return () => clearTimeout(t);
  }, [charIdx, deleting, textIdx, texts]);
  
  return (
    <span className={`typing-cursor ${dark ? 'text-gray-300' : 'text-gray-700'}`}>
      {displayed}
    </span>
  );
};

// ── Intersection Observer Hook ──────────────────────────────────
const useReveal = () => {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add('visible'); obs.unobserve(el); }
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
};

              </a>
            </div>

          </div>
        </div>
      </div>
    </section>
  );
};

// ── Contact ─────────────────────────────────────────────────────
const Contact = ({ dark }) => {
  const ref = useReveal();
  const [form, setForm] = useState({name:'',email:'',message:''});
  const [sent, setSent] = useState(false);
  const handleSubmit = (e) => {
    e.preventDefault();
    setSent(true);
    setTimeout(() => setSent(false), 3000);
    setForm({name:'',email:'',message:''});
  };
  
  const inputClass = `w-full px-5 py-3.5 rounded-xl text-sm font-body font-light outline-none transition-all duration-300 ${dark ? 'bg-[#171717] text-white placeholder-gray-500 border border-[#262626] focus:border-gray-400' : 'bg-white text-black placeholder-gray-400 border border-gray-200 focus:border-gray-500'}`;
  
  return (
    <section id="contact" className={`py-32 ${dark ? 'bg-[#111111]' : 'bg-white'}`}>
      <div className="max-w-6xl mx-auto px-6">
        <div className="text-center mb-20">
          <p className="text-xs font-medium tracking-widest uppercase mb-4" style={{color: dark ? '#737373' : '#a3a3a3'}}>Connect</p>
          <h2 className={`font-display font-semibold text-4xl ${dark ? 'text-white' : 'text-black'}`}>Get In <span className="italic text-gray-500">Touch</span></h2>
        </div>
        
        <div ref={ref} className="section-reveal grid md:grid-cols-5 gap-12 max-w-5xl mx-auto">
          {/* Info */}
          <div className="md:col-span-2 space-y-4">
            <h3 className={`font-display text-xl mb-6 ${dark ? 'text-gray-200' : 'text-gray-800'}`}>Contact Details</h3>
            {[
              {icon:'mail',label:'Email',val:'suhani.fgc@gmail.com',url:'mailto:suhani.fgc@gmail.com'},
              {icon:'linkedin',label:'LinkedIn',val:'Suhani Verma',url:'https://linkedin.com/'},
              {icon:'github',label:'GitHub',val:'Suhani Verma',url:'https://github.com/'},
            ].map(({icon,label,val,url}) => (
              <a key={label} href={url} target="_blank" rel="noreferrer"
                className={`flex items-center gap-5 p-4 rounded-xl group transition-all ${dark ? 'hover:bg-[#171717]' : 'hover:bg-[#fafafa]'}`} style={{textDecoration:'none'}}>
                <div className={`w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 border transition-colors ${dark ? 'border-[#262626] text-gray-400 group-hover:border-gray-400 group-hover:text-white' : 'border-gray-200 text-gray-500 group-hover:border-gray-400 group-hover:text-black'}`}>
                  <Icon name={icon} size={20} />
                </div>
                <div>
                  <div className="font-body text-[11px] font-medium tracking-wider uppercase mb-1" style={{color: dark ? '#737373' : '#a3a3a3'}}>{label}</div>
                  <div className={`font-body text-sm font-medium ${dark ? 'text-gray-300' : 'text-gray-700'}`}>{val}</div>
                </div>
              </a>
            ))}
          </div>

          {/* Form */}
          <div className="md:col-span-3">
            <div className={`glass rounded-2xl p-8 md:p-10 ${dark ? '' : 'bg-[#fafafa]'}`}>
              <form onSubmit={handleSubmit} className="space-y-5">
                <div className="grid md:grid-cols-2 gap-5">
                  <input required className={inputClass} placeholder="Name" value={form.name} onChange={e => setForm({...form,name:e.target.value})} />
                  <input required type="email" className={inputClass} placeholder="Email" value={form.email} onChange={e => setForm({...form,email:e.target.value})} />
                </div>
                <textarea required rows={5} className={inputClass} placeholder="Message" value={form.message} onChange={e => setForm({...form,message:e.target.value})} style={{resize:'none'}} />
                <button type="submit" className="btn-primary w-full flex items-center justify-center gap-2 py-4 rounded-xl font-medium text-sm">
                  {sent ? <><Icon name="check" size={16}/> Message Sent</> : 'Send Message'}
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
};

// ── Footer ──────────────────────────────────────────────────────
const Footer = ({ dark }) => (
  <footer className={`border-t py-12 ${dark ? 'border-[#171717] bg-[#0a0a0a]' : 'border-gray-200 bg-white'}`}>
    <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
      <div className="font-display font-semibold text-lg tracking-wide">
        <span className={dark ? 'text-white' : 'text-black'}>Suhani</span> <span className="italic text-gray-500">Verma</span>
      </div>
      <div className="font-body text-xs font-light" style={{color: dark ? '#737373' : '#a3a3a3'}}>
        © 2026 Suhani Verma.
      </div>
    </div>
  </footer>
);

// ── Loading Screen ──────────────────────────────────────────────
const Loader = ({ onDone, dark }) => {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const t = setInterval(() => {
      setProgress(p => {
        if (p >= 100) { clearInterval(t); setTimeout(onDone, 400); return 100; }
        return p + 2;
      });
    }, 20);
    return () => clearInterval(t);
  }, [onDone]);
  return (
    <div className={`fixed inset-0 z- flex flex-col items-center justify-center ${dark ? 'bg-[#0a0a0a]' : 'bg-[#fafafa]'}`}>
      <div className="font-display font-light text-5xl mb-8 tracking-widest opacity-80" style={{animation:'pulseGlow 2s ease-in-out infinite', color: dark ? '#e5e5e5' : '#171717'}}>
        SV
      </div>
      <div className="w-48 h-[1px] overflow-hidden" style={{background: dark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)'}}>
        <div className="h-full transition-all duration-75" style={{width:`${progress}%`,background: dark ? '#ffffff' : '#000000'}} />
      </div>
    </div>
  );
};

// ── App ─────────────────────────────────────────────────────────
const App = () => {
  const [dark, setDark] = useState(true);
  const [loaded, setLoaded] = useState(false);
  useEffect(() => {
    if (dark) document.documentElement.classList.add('dark');
    else document.documentElement.classList.remove('dark');
  }, [dark]);
  
  if (!loaded) return <Loader onDone={() => setLoaded(true)} dark={dark} />;
  
  return (
    <div className={dark ? 'min-h-screen text-gray-200' : 'min-h-screen text-gray-800'} style={{transition:'background 0.5s ease'}}>
      <Navbar dark={dark} toggleDark={() => setDark(d => !d)} />
      <Hero dark={dark} />
      <About dark={dark} />
      <Skills dark={dark} />
      <Projects dark={dark} />
      <Experience dark={dark} />
      <Achievements dark={dark} />
      <Contact dark={dark} />
      <Footer dark={dark} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
